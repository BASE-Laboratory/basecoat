name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-matrix:
    name: Py ${{ matrix.python-version }} / NumPy ${{ matrix.numpy-spec }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        numpy-spec: ["2.*"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            numpy-spec: "1.26.*"
          - os: windows-latest
            python-version: "3.11"
            numpy-spec: "1.26.*"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install bare runtime + pytest
        shell: bash
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install -e . "numpy==${{ matrix.numpy-spec }}" "pytest>=8.0"
      - name: Run bare-runtime test suite
        shell: bash
        run: |
          uv run pytest -v

  lint-type-and-validators:
    name: Lint, Strict Mypy, SimpleITK Parity & OME-Zarr Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install full dev environment
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Ruff lint & format check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Strict mypy check
        run: |
          uv run mypy src/basecoat
      - name: Full test suite (with SimpleITK parity & external OME-NGFF validator)
        run: |
          uv run pytest --cov=basecoat --cov-report=term-missing -v
